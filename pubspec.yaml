name: sme_prefeitura_sao_paulo_app
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

environment:
  sdk: ">=2.7.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter

  get: ^4.1.4
  font_awesome_flutter:
  flutter_native_splash:
  build_runner: ^2.0.4
  json_serializable: ^4.1.3
  get_storage: ^2.0.2
  path_provider: ^2.0.2
  dio: ^4.0.0
  smart_select: ^4.3.2
  flutter_barcode_scanner: ^2.0.0
  geolocator: ^7.1.1
  flutter_html: ^2.0.0
  cupertino_icons: ^1.0.0
  intl:

dev_dependencies:
  flutter_launcher_icons: ^0.9.0

  flutter_test:
    sdk: flutter


dependency_overrides:
  chewie: ^1.3.0
  wakelock: ^0.6.2
  platform: 2.2.1

flutter_icons:
  android: "launcher_icon"
  image_path: "assets/img/logo-sme-brasao.png"


flutter:

  uses-material-design: true

  assets:
    - assets/img/

flutter_native_splash:
  image: "assets/img/logo-sme.png"
  color: "ffffff"
